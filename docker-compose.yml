# LLM Output Reliability Platform — service definitions
#
#   docker compose up dashboard          # dashboard (:8501)
#   docker compose run --rm evaluate     # an evaluation run
#   docker compose run --rm prepare      # corpus + sample output preparation
#   docker compose up mlflow             # experiment tracking (:5000)

services:
  dashboard:
    build: .
    image: llm-trust:latest
    container_name: llm-trust-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./db:/app/db
      - ./results:/app/results
      - ./mlruns:/app/mlruns
      # Files uploaded from the "Add Model" tab are written here; without
      # this volume they'd be lost whenever the container is recreated.
      - ./llm_outputs:/app/llm_outputs
    environment:
      AITB__LOGGING__JSON_FORMAT: "true"
      # Dashboard password: generate a hash with python -m core.dashboard_auth
      # and write it to a .env file at the project root as
      # AITB__DASHBOARD__PASSWORD_HASH=<hash> (.env is not added to the repo).
      # If left empty, access is fully denied (fail-closed).
      AITB__DASHBOARD__PASSWORD_HASH: ${AITB__DASHBOARD__PASSWORD_HASH:-}
    restart: unless-stopped

  # An evaluation run. Network access is disabled: the platform is designed
  # to run on an internal / air-gapped network, and no component downloads
  # a model or data at runtime.
  evaluate:
    build: .
    image: llm-trust:latest
    container_name: llm-trust-evaluate
    command: ["python", "benchmark_engine.py"]
    network_mode: "none"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    tmpfs:
      - /tmp:rw,size=128m
    volumes:
      - ./db:/app/db
      - ./results:/app/results
      - ./mlruns:/app/mlruns
      - ./llm_outputs:/app/llm_outputs:ro
      - ./data:/app/data:ro
      - ./config:/app/config:ro
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      AITB__MLFLOW__TRACKING_URI: "file:/app/mlruns"
      # /app cannot be written to under read_only:true; the poisoning
      # simulation's cache (settings.paths.poison_cache_dir) is redirected
      # to /tmp, the only writable location. Otherwise it would fail
      # silently and the poisoning score would drop to 0 (see
      # llm_security/data_poisoning_sim.py).
      AITB__PATHS__POISON_CACHE_DIR: "/tmp/cache_poison"
    profiles: ["jobs"]

  # Corpus indexing and sample output generation. This step has network
  # access since it may download the embedding model; for an internal-network
  # setup, place the model on disk ahead of time and run this service too
  # with network_mode: none.
  prepare:
    build: .
    image: llm-trust:latest
    container_name: llm-trust-prepare
    command:
      - "sh"
      - "-c"
      - "python -m rag.ingest --seed --reset && python -m scripts.generate_llm_outputs"
    volumes:
      - ./db:/app/db
      - ./data:/app/data
      - ./llm_outputs:/app/llm_outputs
      - ./config:/app/config:ro
    profiles: ["jobs"]

  mlflow:
    build: .
    image: llm-trust:latest
    container_name: llm-trust-mlflow
    command:
      - "mlflow"
      - "ui"
      - "--host=0.0.0.0"
      - "--port=5000"
      - "--backend-store-uri=file:/app/mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    restart: unless-stopped
