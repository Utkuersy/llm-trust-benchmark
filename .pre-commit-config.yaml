# Kurulum:  pip install pre-commit && pre-commit install
# Tum dosyalarda calistir:  pre-commit run --all-files
#
# lint/tip/guvenlik kancalari bu klasoru haric tutar.

exclude: '^(mlruns/|results/|db/|\.venv/)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports, --no-strict-optional]
        additional_dependencies: [pydantic>=2.6, types-PyYAML]
        files: '^(core|capability|rag|llm_security)/'

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "--severity-level", "medium"]
        additional_dependencies: ["bandit[toml]"]
        files: '^(core|capability|rag|llm_security|scripts)/'

  - repo: local
    hooks:
      - id: pylint-platform
        name: pylint (platform kodu)
        entry: pylint
        language: system
        types: [python]
        args: ["--fail-under=8.5", "--disable=import-error"]
        files: '^(core|capability|rag|llm_security)/'
