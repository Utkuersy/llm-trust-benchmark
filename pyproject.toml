[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-benchmark"
version = "2.0.0"
description = "AI Trustworthiness Benchmark Platform — code and LLM/RAG reliability measurement"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["core", "capability", "rag", "llm_security", "scripts"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mlruns", "results", "db", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # line length is managed by the formatter
    "B008",   # FastAPI/Pydantic-style defaults
    "RUF001", # em-dashes and other confusable Unicode in docstrings get flagged as "ambiguous"
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]
"app.py" = ["ARG001"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(mlruns|results|\\.venv)/"
plugins = []

[[tool.mypy.overrides]]
module = ["chromadb.*", "ragas.*", "mlflow.*", "sentence_transformers.*", "radon.*", "datasets.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
# Needed so root-level packages like core/, capability/, llm_security/ can
# be imported without a package install (pip install -e .) at the project
# root. "python -m pytest" adds the CWD automatically, but the bare "pytest"
# command (which CI uses) does not; this setting works regardless of how
# it's invoked.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long-running tests",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "mlruns", "results", ".venv"]
skips = ["B101"]

# --------------------------------------------------------------------------- #
# Pylint
# --------------------------------------------------------------------------- #
[tool.pylint.main]
ignore-paths = ["mlruns", "results", "\\.venv"]
jobs = 0

[tool.pylint."messages control"]
disable = [
    "import-error",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100
