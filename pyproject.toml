[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trust-benchmark"
version = "2.0.0"
description = "AI Trustworthiness Benchmark Platform — kod ve LLM/RAG güvenilirlik ölçümü"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[tool.setuptools]
packages = ["core", "capability", "rag", "llm_security", "scripts"]

# --------------------------------------------------------------------------- #
# Ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["mlruns", "results", "db", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RUF"]
ignore = [
    "E501",   # satır uzunluğu formatter tarafından yönetiliyor
    "B008",   # FastAPI/Pydantic tarzı varsayılanlar
    "RUF001", # Türkçe karakterler "belirsiz unicode" olarak işaretleniyor
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "S101"]
"app.py" = ["ARG001"]

# --------------------------------------------------------------------------- #
# mypy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = "(mlruns|results|\\.venv)/"
plugins = []

[[tool.mypy.overrides]]
module = ["chromadb.*", "ragas.*", "mlflow.*", "sentence_transformers.*", "radon.*", "datasets.*"]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: uzun süren testler",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "mlruns", "results", ".venv"]
skips = ["B101"]

# --------------------------------------------------------------------------- #
# Pylint
# --------------------------------------------------------------------------- #
[tool.pylint.main]
ignore-paths = ["mlruns", "results", "\\.venv"]
jobs = 0

[tool.pylint."messages control"]
disable = [
    "import-error",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "duplicate-code",
]

[tool.pylint.format]
max-line-length = 100
